map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream sf_station  { server SFStation:8000; }
upstream sf_api      { server SFApi:80; }
upstream sf_graphql  { server SFGraphQLApi:80; }
upstream sf_keycloak { server keycloak-server:8080; }

server {
    listen 80 default_server;
    server_name presales-demo-1u.ba.innovatrics.net _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name presales-demo-1u.ba.innovatrics.net _;

    ssl_certificate     /etc/nginx/certs/presales-demo-1u.ba.innovatrics.net.pem;
    ssl_certificate_key /etc/nginx/certs/presales-demo-1u.ba.innovatrics.net-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    client_max_body_size 100M;
    proxy_read_timeout 24h;
    proxy_send_timeout 24h;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Proto https;

    location /auth/ { proxy_pass http://sf_keycloak; }
    location /api/  { proxy_pass http://sf_api; }

    location /graphql {
        proxy_pass http://sf_graphql;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://sf_station;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
    }
}
