  #  container_name: mssql
  #  ports:
  #    - "1433:1433"
  #  environment:
  #    - ACCEPT_EULA=Y
  #    - SA_PASSWORD=Test1234
  #  restart: unless-stopped
  #  volumes:
  #    - mssqldata:/var/opt/mssql
      #- /var/lib/smartface/mssql:/var/opt/mssql
      #- /var/lib/smartface/mssql:/var/opt/mssql

  pgsql:
    image: "postgres:14.3"
    container_name: pgsql
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=Test1234
    restart: unless-stopped
    volumes:
      - pgsqldata:/var/lib/postgresql/data
      #- /var/lib/smartface/pgsql:/var/lib/postgresql/data

  pgadmin:
    image: "dpage/pgadmin4:6.10"
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: Test1234
    ports:
      - "7070:80"

  rabbitmq:
    image: "rabbitmq:3.12.11-management"
    container_name: rmq
    ports:
      - "15672:15672"
      - "5672:5672"
      - "1883:1883"
      - "5552:5552/tcp"
    environment:
      RABBITMQ_NODENAME: rabbit@rmq
      RABBITMQ_CONFIG_FILE: /etc/rabbitmq/external/rabbitmq.conf
      RABBITMQ_ENABLED_PLUGINS_FILE: /etc/rabbitmq/external/enabled_plugins
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: -rabbitmq_stream advertised_host rmq      
    volumes:
      - ./etc_rmq/:/etc/rabbitmq/external
      - rmqdata:/var/lib/rabbitmq
    restart: unless-stopped

  # SeaweedFS replaces MinIO as the S3-compatible blob storage (temporary workaround).
  seaweedfs:
    image: "chrislusf/seaweedfs:4.16"
    container_name: seaweedfs
    # Bypass the image entrypoint (chowns /data and drops to the seaweed user) and run as root, like MinIO did.
    entrypoint: ["/usr/bin/weed"]
    command: server -s3 -s3.config=/etc/seaweedfs/s3.json -filer=true -dir=/data -master.volumeSizeLimitMB=1024 -volume.max=500
    environment:
      # single-node setup: never try to replicate volumes
      WEED_MASTER_VOLUME_GROWTH_COPY_1: "1"
    ports:
      - "8333:8333" # S3 API
    restart: unless-stopped
    volumes:
      - ./etc_seaweedfs/:/etc/seaweedfs
      - seaweedfsdata:/data
      #- /var/lib/smartface/seaweedfsdata:/data

volumes:
  mssqldata:
  pgsqldata:
  seaweedfsdata:
  rmqdata:


networks:
  default:
    name: sf-network
    external: true
